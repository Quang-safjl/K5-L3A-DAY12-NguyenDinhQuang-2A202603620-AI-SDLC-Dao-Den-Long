name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Tính tất định 3 đêm (chạy 2 lần, so sánh)
        run: |
          for n in 1 2 3; do
            node headless.js --seed 42 --night $n --ticks 4000 --out a.jsonl
            node headless.js --seed 42 --night $n --ticks 4000 --out b.jsonl
            cmp a.jsonl b.jsonl
          done
      - name: Bot thắng Đêm 1 và 2 (bản đồ không kẻ địch)
        run: |
          for n in 1 2; do
            node headless.js --seed 42 --night $n --scenario scenarios/calm.scenario.json --inputs scenarios/autoplay-calm-n$n.inputs.json --ticks 21600 --out w.jsonl
            tail -1 w.jsonl | grep '"state":"won"'
          done
